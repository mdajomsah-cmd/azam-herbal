<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - আজম হারবাল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#f0f4e8}
.header{background:#0f3d2e;color:white;padding:14px;text-align:center}
.card{background:white;margin:12px;padding:16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
input{width:100%;padding:14px;border:1.5px solid #0f3d2e;border-radius:12px;margin-top:10px;outline:none;font-size:18px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:700;cursor:pointer;font-size:17px}
.btn-green{background:#0f3d2e;color:white}
.btn-red{background:#ffeeee;color:#cc0000;margin-top:10px}
.hidden{display:none}
#previewImg{width:100%;height:180px;object-fit:cover;border-radius:12px;margin-top:10px;display:none;border:2px solid #0f3d2e}
.lock-icon{font-size:60px;text-align:center}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:white;text-decoration:none;float:left;font-size:20px">←</a><h3>🔒 Secure Admin</h3></div>

<div id="loginBox" class="card" style="margin-top:40px;text-align:center;max-width:400px;margin:auto">
<div class="lock-icon">🔒</div>
<h2>গোপন পিন দিন</h2>
<p style="color:#888;font-size:13px;margin:8px 0">শুধুমাত্র মালিক প্রবেশ করতে পারবেন</p>
<input id="pinInput" type="password" placeholder="•••••" maxlength="5">
<button class="btn btn-green" onclick="login()" style="margin-top:16px">🔓 প্রবেশ করুন</button>
<p id="errMsg" style="color:red;font-size:14px;margin-top:10px;display:none">ভুল পিন!</p>
</div>

<div id="adminBox" class="hidden">
<div class="card">
<h3>➕ নতুন পণ্য যোগ করুন</h3>
<input id="pName" placeholder="পণ্যের নাম">
<input id="pPrice" type="number" placeholder="দাম">
<input id="pCat" placeholder="ক্যাটাগরি" value="মধু">
<label style="display:block;margin-top:12px;font-weight:bold">📸 ছবি যোগ করুন:</label>
<input id="pImage" type="file" accept="image/*">
<img id="previewImg">
<button class="btn btn-green" style="margin-top:12px" onclick="addProduct()">✅ যোগ করুন</button>
<button class="btn btn-red" onclick="clearAllProducts()">🗑️ পুরাতন সব মুছুন</button>
</div>
<div class="card"><h3>📦 পণ্য তালিকা</h3><div id="productList"></div></div>
<div class="card"><h3>🛒 অর্ডার তালিকা</h3><div id="orderList"></div></div>
<div class="card" style="text-align:center">
<button class="btn" style="background:#333;color:white" onclick="logout()">🚪 নিরাপদ লগআউট</button>
</div>
</div>
<script>
const SECRET_PIN='44557';
let currentImageBase64='';
let defaultProducts=[{id:1,name:'খাঁটি মধু',price:1500,cat:'মধু',img:'🍯'}];
function getProducts(){let s=localStorage.getItem('azam_products');try{return s?JSON.parse(s):defaultProducts}catch(e){return defaultProducts}}
function saveProducts(p){localStorage.setItem('azam_products',JSON.stringify(p))}
document.getElementById('pImage').addEventListener('change', function(e){
let file=e.target.files[0];if(!file)return;
let reader=new FileReader();
reader.onload=function(ev){currentImageBase64=ev.target.result;let pre=document.getElementById('previewImg');pre.src=currentImageBase64;pre.style.display='block';}
reader.readAsDataURL(file);
});
function login(){
let pin=document.getElementById('pinInput').value.trim();
if(pin===SECRET_PIN){
sessionStorage.setItem('azam_admin_auth','verified_'+Date.now());
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('adminBox').classList.remove('hidden');
renderAll();
}else{document.getElementById('errMsg').style.display='block';document.getElementById('pinInput').value='';}
}
function checkAuth(){
let auth=sessionStorage.getItem('azam_admin_auth');
if(auth && auth.startsWith('verified_')){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');renderAll();}
}
function logout(){sessionStorage.removeItem('azam_admin_auth');location.reload();}
function addProduct(){let name=document.getElementById('pName').value.trim();let price=parseInt(document.getElementById('pPrice').value);let cat=document.getElementById('pCat').value.trim()||'মধু';if(!name||!price){alert('নাম ও দাম দিন');return;}if(!currentImageBase64){alert('ছবি নির্বাচন করুন');return;}let p=getProducts();p.push({id:Date.now(),name,price,cat,img:currentImageBase64,isImage:true});saveProducts(p);document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImage').value='';currentImageBase64='';document.getElementById('previewImg').style.display='none';renderAll();}
function clearAllProducts(){if(confirm('সব মুছে ফেলবেন?')){saveProducts([]);renderAll();}}
function deleteProduct(id){let p=getProducts().filter(x=>x.id!==id);saveProducts(p);renderAll();}
function renderProducts(){let l=document.getElementById('productList');let products=getProducts();if(products.length===0){l.innerHTML='<p style=text-align:center;color:#888>কোন পণ্য নেই</p>';return;}l.innerHTML=products.map(p=>{let imgTag=p.isImage?`<img src="${p.img}" style="width:50px;height:50px;object-fit:cover;border-radius:8px">`:`<span style="font-size:30px">${p.img||'📦'}</span>`;return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><div style="display:flex;gap:10px;align-items:center">${imgTag}<div><b>${p.name}</b><br><small>৳${p.price}</small></div></div><button class="btn btn-red" style="width:auto;padding:6px 12px" onclick="deleteProduct(${p.id})">মুছুন</button></div>`;}).join('');}
function renderOrders(){let l=document.getElementById('orderList');let o=JSON.parse(localStorage.getItem('azam_orders')||'[]');if(o.length===0){l.innerHTML='<p style=text-align:center;color:#888>কোন অর্ডার নেই</p>';return;}l.innerHTML=o.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #eee"><b>${x.name||x.cName}</b> - ${x.phone||x.cPhone}</div>`).join('');}
function renderAll(){renderProducts();renderOrders();}
checkAuth();
</script>
</body>
</html>
