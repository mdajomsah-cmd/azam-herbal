<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাওলানা আজম শাহ অনলাইন শপ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#f0f4e8;color:#1a1a1a;padding-bottom:80px}
.header{background:#0f3d2e;color:white;padding:16px}
.searchBox{background:white;border-radius:14px;display:flex;overflow:hidden;margin-top:12px}
.searchBox input{flex:1;padding:14px;border:none;outline:none;font-size:16px}
.searchBox button{background:#d4a017;border:none;padding:0 20px;font-size:20px}
.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.catCard{background:white;border-radius:16px;padding:20px;text-align:center;font-weight:700}
.container{max-width:800px;margin:auto}
.card{background:white;border-radius:18px;padding:14px;margin:12px;box-shadow:0 3px 10px rgba(0,0,0,0.07)}
.card img{width:100%;height:240px;object-fit:cover;border-radius:14px}
.price{font-size:22px;font-weight:700;color:#0f3d2e;margin-top:6px}
.btn{width:100%;padding:14px;background:#0f3d2e;color:white;border:none;border-radius:14px;font-size:18px;font-weight:700;margin-top:10px;cursor:pointer}
.fbBox{background:linear-gradient(135deg,#e8f5e9,#fff);border:2px solid #0f3d2e;border-radius:18px;padding:18px;margin:12px;text-align:center}
.fbBtn{display:block;padding:12px;margin:8px 0;border-radius:10px;color:white;text-decoration:none;font-weight:700}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #ddd;z-index:999}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;gap:10px;align-items:center">
<div style="width:50px;height:50px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px">🌿</div>
<div><h3>মাওলানা আজম শাহ<br>অনলাইন শপ</h3><small>বিশ্বস্ত পণ্য • সহজ অর্ডার • হোম ডেলিভারি</small></div>
</div>
<div style="background:#d4a017;padding:10px 16px;border-radius:14px;text-align:center;font-weight:700">🛒<br><span>0</span></div>
</div>
<div class="searchBox"><input placeholder="পণ্য খুঁজুন..."><button>🔍</button></div>
</div>

<div class="container">
<div class="catGrid">
<div class="catCard">🛍️<br>সব</div>
<div class="catCard">🌿<br>আয়ুর্বেদিক</div>
<div class="catCard">💄<br>কসমেটিকস</div>
<div class="catCard">👗<br>পোশাক</div>
</div>

<h2 style="padding:12px">জনপ্রিয় পণ্য</h2>
<div id="productGrid"></div>

<div class="fbBox">
<h3>🌿 আমাদের Facebook পেজে যুক্ত থাকুন</h3>
<a class="fbBtn" style="background:#1877F2" href="https://www.facebook.com/share/1Y7AGQaD54/" target="_blank">📘 Facebook Page 1</a>
<a class="fbBtn" style="background:#0f3d2e" href="https://www.facebook.com/share/18XPzPbG4v/" target="_blank">📘 Facebook Page 2</a>
</div>

<div class="card">
<h2 style="color:#0f3d2e;text-align:center">📝 অর্ডার করুন</h2>
<input id="cName" placeholder="আপনার নাম *" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px">
<input id="cPhone" placeholder="মোবাইল নম্বর *" style="width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px">
<input id="cProd" placeholder="পণ্য" readonly style="width:100%;padding:14px;border-radius:12px;margin-top:10px;background:#f0f4e8;font-weight:bold">
<button class="btn" onclick="placeOrder()">✅ WhatsApp এ অর্ডার করুন</button>
</div>
</div>

<div class="bottomNav">
<div>🏠<br>হোম</div><div>📝<br>অর্ডার</div><div>⊞<br>ক্যাটাগরি</div><div>🛒<br>কার্ট</div><div onclick="location.href='admin.html'">👤<br>Admin</div>
</div>

<script>
let defaultProducts=[{id:1,name:'খাঁটি মধু',price:1500,cat:'আয়ুর্বেদিক',img:'🍯',isImage:false}];
function getProducts(){
  let s=localStorage.getItem('azam_products');
  try{ if(s){ let p=JSON.parse(s); if(p.length>0) return p; } return defaultProducts; }catch(e){return defaultProducts;}
}
function render(){
  let grid=document.getElementById('productGrid');
  let products=getProducts();
  grid.innerHTML=products.map(p=>{
    let imgHtml='';
    if(p.isImage && p.img && p.img.startsWith('data:')){ imgHtml=`<img src="${p.img}">`; }
    else{ imgHtml=`<div style="height:240px;background:#f0f4e8;display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:14px">${p.img||'🌿'}</div>`; }
    return `<div class="card">${imgHtml}<h3 style="margin:10px 0 4px">${p.name}</h3><p style="color:#666;font-size:14px">${p.cat}</p><div class="price">৳${p.price}</div><button class="btn" onclick="selectProduct('${p.name.replace(/'/g,'')}')">🛒 অর্ডার করুন</button></div>`;
  }).join('');
}
function selectProduct(name){ document.getElementById('cProd').value=name; window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}); }
function placeOrder(){ let name=document.getElementById('cName').value.trim(); let phone=document.getElementById('cPhone').value.trim(); let prod=document.getElementById('cProd').value.trim(); if(!name||!phone){alert('নাম ও মোবাইল দিন');return;} let msg=`আসসালামু আলাইকুম, আমি ${name}, ${prod} অর্ডার করতে চাই। মোবাইল: ${phone}`; window.open(`https://wa.me/8801XXXXXXXXX?text=${encodeURIComponent(msg)}`,'_blank'); }
render();
</script>
</body>
</html>
