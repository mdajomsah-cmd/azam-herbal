<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>মাওলানা আজম শাহ অনলাইন শপ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#f8faf5;color:#1a3c2a;padding-bottom:90px}
.header{background:#0f3d2e;color:white;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{display:flex;gap:10px;align-items:center}
.logo-icon{width:48px;height:48px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px}
.logo h1{font-size:17px;line-height:1.2;font-weight:700}
.logo p{font-size:11px;color:#d4e8c2;letter-spacing:.5px}
.cart-btn{background:#d4a017;color:white;border:none;width:58px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.search-bar{background:#0f3d2e;padding:0 16px 14px;display:flex;gap:0}
.search-bar input{flex:1;padding:12px 16px;border-radius:12px 0 0 12px;border:none;outline:none;font-size:15px}
.search-bar button{background:#d4a017;border:none;padding:0 18px;border-radius:0 12px 12px 0;font-size:18px;cursor:pointer}
.categories{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px}
.cat-card{background:white;border:1.5px solid #e2e8d5;padding:14px;border-radius:16px;text-align:center;cursor:pointer;transition:.2s}
.cat-card.active{background:#e8f3d9;border-color:#0f3d2e}
.cat-card .emoji{font-size:28px}
.cat-card p{margin-top:4px;font-weight:600;font-size:14px}
.section-title{display:flex;justify-content:space-between;align-items:center;padding:10px 16px 6px}
.section-title h2{font-size:18px;font-weight:700}
.section-title a{color:#d4a017;text-decoration:none;font-size:14px;font-weight:600}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px}
.product-card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2e6}
.product-img{background:#eaf5e1;height:130px;display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-info{padding:10px}
.product-info h3{font-size:15px;font-weight:600;line-height:1.3;height:38px;overflow:hidden}
.product-info .price{color:#b78a00;font-weight:700;font-size:17px;margin:6px 0}
.btn-row{display:flex;gap:6px}
.btn-cart{flex:1;background:#0f3d2e;color:white;border:none;padding:7px 6px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px}
.btn-wa{flex:1;background:#fdf3d0;color:#7a5a00;border:none;padding:7px 6px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:8px 0 10px;z-index:20}
.nav-item{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#6b7280;font-size:11px;font-weight:500;gap:2px}
.nav-item.active{color:#0f3d2e}
.nav-item .icon{font-size:22px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0f3d2e;color:white;padding:10px 18px;border-radius:24px;font-size:13px;display:none;z-index:100}
.cart-drawer{position:fixed;top:0;right:-100%;width:88%;max-width:380px;height:100%;background:white;z-index:50;transition:.3s;box-shadow:-4px 0 20px rgba(0,0,0,.15);display:flex;flex-direction:column}
.cart-drawer.open{right:0}
.cart-header{padding:16px;background:#0f3d2e;color:white;display:flex;justify-content:space-between;align-items:center}
.cart-items{flex:1;overflow:auto;padding:12px}
.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.cart-item img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#eaf5e1}
.cart-footer{padding:14px;border-top:1px solid #eee}
.order-btn{width:100%;background:#0f3d2e;color:white;border:none;padding:12px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:40}
.overlay.show{display:block}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🌿</div>
    <div>
      <h1>মাওলানা আজম শাহ<br>অনলাইন শপ</h1>
      <p>বিশ্বস্ত পণ্য • সহজ অর্ডার • হোম ডেলিভারি</p>
    </div>
  </div>
  <button class="cart-btn" onclick="toggleCart()">🛒<span id="cartCount">0</span></button>
</div>

<div class="search-bar">
  <input id="searchInput" type="text" placeholder="পণ্য খুঁজুন..." oninput="renderProducts()">
  <button>🔍</button>
</div>

<div class="categories">
  <div class="cat-card active" onclick="filterCat('সব',this)"><div class="emoji">🛍️</div><p>সব</p></div>
  <div class="cat-card" onclick="filterCat('আয়ুর্বেদিক',this)"><div class="emoji">🌿</div><p>আয়ুর্বেদিক</p></div>
  <div class="cat-card" onclick="filterCat('কসমেটিকস',this)"><div class="emoji">💄</div><p>কসমেটিকস</p></div>
  <div class="cat-card" onclick="filterCat('পোশাক',this)"><div class="emoji">👗</div><p>পোশাক</p></div>
</div>

<div class="section-title"><h2>জনপ্রিয় পণ্য</h2><a href="#">সব</a></div>
<div class="products" id="productsGrid"></div>

<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header"><h3>আপনার কার্ট</h3><button onclick="toggleCart()" style="background:none;border:none;color:white;font-size:22px">✕</button></div>
  <div class="cart-items" id="cartItems">কার্ট খালি</div>
  <div class="cart-footer">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-weight:700"><span>মোট:</span><span id="totalPrice">৳ ০</span></div>
    <button class="order-btn" onclick="orderWhatsApp()">WhatsApp এ অর্ডার করুন</button>
  </div>
</div>

<div class="bottom-nav">
  <a href="#" class="nav-item active"><span class="icon">🏠</span>হোম</a>
  <a href="#" class="nav-item"><span class="icon">⊞</span>ক্যাটাগরি</a>
  <a href="#" class="nav-item"><span class="icon">🔍</span>পণ্য</a>
  <a href="#" onclick="toggleCart();return false" class="nav-item"><span class="icon">🛒</span>কার্ট</a>
  <a href="admin.html" class="nav-item"><span class="icon">👤</span>Admin</a>
</div>

<div id="toast"></div>

<script>
let defaultProducts=[
  {id:1,name:'খাঁটি মধু',price:1200,cat:'আয়ুর্বেদিক',img:'🍯',imgData:''},
  {id:2,name:'হারবাল টনিক',price:850,cat:'আয়ুর্বেদিক',img:'🌿',imgData:''},
  {id:3,name:'কালোজিরা তেল ১০০মিলি',price:450,cat:'আয়ুর্বেদিক',img:'🌿',imgData:''},
  {id:4,name:'নিম তেল ১০০মিলি',price:380,cat:'কসমেটিকস',img:'🧴',imgData:''}
];
let currentCat='সব';
let cart=[];
function getStoredProducts(){
  let s=localStorage.getItem('azam_products');
  if(s){ try{return JSON.parse(s)}catch(e){} }
  return defaultProducts;
}
function saveProducts(p){localStorage.setItem('azam_products',JSON.stringify(p))}
function filterCat(c,el){
  currentCat=c;
  document.querySelectorAll('.cat-card').forEach(x=>x.classList.remove('active'));
  if(el) el.classList.add('active');
  renderProducts();
}
function renderProducts(){
  let q=document.getElementById('searchInput').value.toLowerCase();
  let all=getStoredProducts();
  let filtered=all.filter(p=>{
    let catMatch=currentCat==='সব' || p.cat===currentCat;
    let searchMatch=p.name.toLowerCase().includes(q);
    return catMatch && searchMatch;
  });
  let grid=document.getElementById('productsGrid');
  grid.innerHTML=filtered.map(p=>`
    <div class="product-card">
      <div class="product-img">${p.imgData?`<img src="${p.imgData}">`:p.img}</div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <div class="price">৳ ${p.price.toLocaleString('bn-BD')}</div>
        <div class="btn-row">
          <button class="btn-cart" onclick="addToCart(${p.id})">🛒 কার্টে যোগ</button>
          <button class="btn-wa" onclick="buyWhatsApp('${p.name}',${p.price})">WhatsApp</button>
        </div>
      </div>
    </div>
  `).join('') || '<p style="padding:20px;text-align:center;grid-column:1/3">কোন পণ্য পাওয়া যায়নি</p>';
}
function addToCart(id){
  let prod=getStoredProducts().find(p=>p.id===id);
  let f=cart.find(c=>c.id===id);
  if(f) f.qty++; else cart.push({...prod,qty:1});
  updateCart(); toast('কার্টে যোগ হয়েছে');
}
function updateCart(){
  document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0);
  let itemsDiv=document.getElementById('cartItems');
  if(cart.length===0){itemsDiv.innerHTML='<p style="text-align:center;padding:20px;color:#888">কার্ট খালি</p>';}
  else{
    itemsDiv.innerHTML=cart.map(c=>`
      <div class="cart-item">
        <div style="width:50px;height:50px;background:#eaf5e1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden">${c.imgData?`<img src="${c.imgData}" style="width:100%;height:100%;object-fit:cover">`:c.img}</div>
        <div style="flex:1"><div style="font-weight:600;font-size:13px">${c.name}</div><div style="font-size:12px;color:#b78a00">৳ ${c.price} x ${c.qty}</div></div>
        <button onclick="removeCart(${c.id})" style="border:none;background:#fee;color:#c00;padding:4px 8px;border-radius:8px">✕</button>
      </div>
    `).join('');
  }
  let total=cart.reduce((a,b)=>a+b.price*b.qty,0);
  document.getElementById('totalPrice').innerText='৳ '+total.toLocaleString('bn-BD');
}
function removeCart(id){cart=cart.filter(c=>c.id!==id);updateCart();}
function toggleCart(){
  document.getElementById('cartDrawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function toast(m){let t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
function buyWhatsApp(name,price){
  let msg=`আসসালামু আলাইকুম, আমি ${name} (৳ ${price}) নিতে চাই।`;
  window.open(`https://wa.me/8801700000000?text=${encodeURIComponent(msg)}`,'_blank');
}
function orderWhatsApp(){
  if(cart.length===0){toast('কার্ট খালি');return;}
  let text='আসসালামু আলাইকুম, আমি অর্ডার করতে চাই:%0A';
  cart.forEach(c=>{text+=`%0A- ${c.name} x ${c.qty} = ৳ ${c.price*c.qty}`});
  let total=cart.reduce((a,b)=>a+b.price*b.qty,0);
  text+=`%0A%0Aমোট: ৳ ${total}`;
  let orders=JSON.parse(localStorage.getItem('azam_orders')||'[]');
  orders.unshift({date:new Date().toLocaleString('bn-BD'),items:[...cart],total});
  localStorage.setItem('azam_orders',JSON.stringify(orders));
  window.open(`https://wa.me/8801700000000?text=${text}`,'_blank');
}
renderProducts(); updateCart();
</script>
</body>
</html>
