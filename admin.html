<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{background:#f0f4e8} .header{background:#0f3d2e;color:white;padding:16px;display:flex;gap:12px;align-items:center}
.card{background:white;margin:12px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
input,select{width:100%;padding:12px;border:1.5px solid #d6dbc9;border-radius:12px;margin-top:8px;outline:none}
.btn{padding:12px 16px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
.btn-green{background:#0f3d2e;color:white} .btn-red{background:#fee;color:#c00}
.hidden{display:none}
</style>
</head>
<body>
<div class="header"><a href="index.html" style="color:white;text-decoration:none;font-size:22px">←</a><div><h3>Admin Panel</h3><small>মাওলানা আজম শাহ • গোপন</small></div></div>

<div id="loginBox" class="card" style="margin-top:30px;text-align:center">
  <h2>🔐 Admin Login</h2>
  <p style="color:#888;font-size:12px;margin-top:6px">শুধুমাত্র অ্যাডমিনের জন্য</p>
  <div style="display:flex;gap:8px;margin-top:16px">
    <input id="pinInput" type="password" placeholder="গোপন PIN দিন" style="margin:0">
    <button class="btn btn-green" onclick="login()">প্রবেশ</button>
  </div>
</div>

<div id="adminBox" class="hidden">
  <div class="card"><h3>➕ নতুন পণ্য</h3><input id="pName" placeholder="নাম"><input id="pPrice" type="number" placeholder="দাম"><select id="pCat"><option>আয়ুর্বেদিক</option><option>কসমেটিকস</option><option>পোশাক</option></select><button class="btn btn-green" style="width:100%;margin-top:10px" onclick="addProduct()">যোগ করুন</button></div>
  <div class="card"><h3>📦 পণ্য তালিকা</h3><div id="productList"></div></div>
  <div class="card"><h3>🛒 অর্ডার</h3><div id="orderList"></div></div>
  <div class="card" style="text-align:center"><button class="btn" style="background:#eee" onclick="logout()">লগআউট</button></div>
</div>

<script>
const SECRET_PIN="44557";
let defaultProducts=[{id:1,name:'খাঁটি মধু',price:1200,cat:'আয়ুর্বেদিক',img:'🍯'}];
function getProducts(){let s=localStorage.getItem('azam_products');try{return s?JSON.parse(s):defaultProducts}catch(e){return defaultProducts}}
function saveProducts(p){localStorage.setItem('azam_products',JSON.stringify(p))}
function login(){
  let pin=document.getElementById('pinInput').value.trim();
  if(pin===SECRET_PIN){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminBox').classList.remove('hidden');
    localStorage.setItem('azam_admin','1');renderAll();
  }else{alert('ভুল PIN!');}
}
function checkLogin(){if(localStorage.getItem('azam_admin')==='1'){document.getElementById('loginBox').classList.add('hidden');document.getElementById('adminBox').classList.remove('hidden');renderAll();}}
function logout(){localStorage.removeItem('azam_admin');location.reload();}
function addProduct(){let n=document.getElementById('pName').value.trim();let pr=parseInt(document.getElementById('pPrice').value);let c=document.getElementById('pCat').value;if(!n||!pr){alert('নাম দাম দিন');return;}let p=getProducts();p.unshift({id:Date.now(),name:n,price:pr,cat:c,img:'🌿'});saveProducts(p);renderAll();alert('যোগ হয়েছে');}
function deleteProduct(id){let p=getProducts().filter(x=>x.id!==id);saveProducts(p);renderAll();}
function renderProducts(){let l=document.getElementById('productList');l.innerHTML=getProducts().map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><span>${p.name} - ৳${p.price}</span><button class="btn btn-red" onclick="deleteProduct(${p.id})">মুছুন</button></div>`).join('')}
function renderOrders(){let d=document.getElementById('orderList');let o=JSON.parse(localStorage.getItem('azam_orders')||'[]');d.innerHTML=o.length?o.map(x=>`<div style="border:1px solid #eee;padding:8px;border-radius:8px;margin-bottom:6px"><b>${x.customer?.name||''}</b> ${x.customer?.phone||''}<br>৳${x.total||0}</div>`).join(''):'<p style="color:#888">কোন অর্ডার নেই</p>'}
function renderAll(){renderProducts();renderOrders();}
checkLogin();
</script>
</body>
</html>
